[project]
name = "lead-intelligence"
version = "0.1.0"
description = "Public-records lead intelligence engine: collection, backtests, and signal research"
requires-python = ">=3.11"
dependencies = [
    "duckdb>=1.1",
]

[dependency-groups]
dev = ["ruff>=0.6"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
# SQL templates, regex tables and report renderers read better unwrapped: research code plus the SQL-heavy engine
# modules (snapshot/pest/prospects, contact enrichment, the shared signal SQL, and the clerk/overture/PTAX collectors).
"{research/**,engine/{leads,enrich}/*.py,engine/score/{events,food,licenses}.py,engine/collect/{clerk,overture,ptax}.py}" = ["E501"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["engine"]
