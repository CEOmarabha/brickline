[project]
name = "lead-intelligence"
version = "0.1.0"
description = "Public-records lead intelligence engine: collection, backtests, and signal research"
requires-python = ">=3.11"
dependencies = [
    "duckdb>=1.1",
]

[dependency-groups]
dev = ["ruff>=0.6"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
# Report renderers and SQL templates read better unwrapped.
"research/**" = ["E501"]
"engine/leads/*.py" = ["E501"]
"engine/score/food.py" = ["E501"]
"engine/score/licenses.py" = ["E501"]
"engine/enrich/*.py" = ["E501"]
"engine/collect/overture.py" = ["E501"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["engine"]
