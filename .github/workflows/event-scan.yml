name: Daily event-lead scan

on:
  schedule:
    # 12:00 UTC = 6 AM CST / 7 AM CDT; 13:00 UTC = 7 AM CST / 8 AM CDT.
    # --require-chicago-hour keeps only the 7 AM America/Chicago slot.
    - cron: "0 12 * * *"
    - cron: "0 13 * * *"
  workflow_dispatch:

jobs:
  scan:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install duckdb
      - name: Scan (public calendars + free listings only)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          FIRECRAWL_API_KEY: ${{ secrets.FIRECRAWL_API_KEY }}
          FIRECRAWL_API_URL: ${{ secrets.FIRECRAWL_API_URL }}
        run: python -m engine.leads.event_scan --public-only --no-llm --require-chicago-hour
      - name: Commit snapshot
        run: |
          git config user.name "brickline-event-scan"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/data/event-leads.json web/data/event-digest.json
          if git diff --cached --quiet; then
            echo "no snapshot changes"
          else
            git commit -m "chore: daily event-lead scan"
            git push
          fi
