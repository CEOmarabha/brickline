name: Daily event-lead scan

on:
  schedule:
    # 12:00 UTC = 6 AM CST / 7 AM CDT; 13:00 UTC = 7 AM CST / 8 AM CDT.
    # --require-chicago-hour keeps only the 7 AM America/Chicago slot.
    - cron: "0 12 * * *"
    - cron: "0 13 * * *"
  workflow_dispatch:
    inputs:
      public_only:
        description: Skip authenticated social collectors
        type: boolean
        default: false

jobs:
  scan:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install duckdb
      - name: Scan
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
          SERPAPI_API_KEY: ${{ secrets.SERPAPI_API_KEY }}
          FIRECRAWL_API_KEY: ${{ secrets.FIRECRAWL_API_KEY }}
          FB_COOKIE: ${{ secrets.FB_COOKIE }}
          IG_COOKIE: ${{ secrets.IG_COOKIE }}
          TIKTOK_COOKIE: ${{ secrets.TIKTOK_COOKIE }}
          REDDIT_CLIENT_ID: ${{ secrets.REDDIT_CLIENT_ID }}
          REDDIT_CLIENT_SECRET: ${{ secrets.REDDIT_CLIENT_SECRET }}
          X_BEARER_TOKEN: ${{ secrets.X_BEARER_TOKEN }}
        run: |
          extra=()
          if [[ "${{ github.event.inputs.public_only }}" == "true" ]]; then
            extra+=(--public-only)
          fi
          python -m engine.leads.event_scan --require-chicago-hour --no-llm "${extra[@]}"
      - name: Commit snapshot
        run: |
          git config user.name "brickline-event-scan"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/data/event-leads.json web/data/event-digest.json
          if git diff --cached --quiet; then
            echo "no snapshot changes"
          else
            git commit -m "chore: daily event-lead scan"
            git push
          fi
